backend:
  name: git-gateway
  branch: main

# 로컬(내 컴퓨터)에서 테스트할 때만 아래 주석을 해제하세요.
# local_backend: true

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "wiki"
    label: "위키 문서"
    label_singular: "문서"
    folder: "src/wiki"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options: ["인물", "장소", "설정", "사건", "아이템", "기타"]
        default: "기타"
      - { label: "태그(내부용, 건드리지 마세요)", name: "tags", widget: "hidden", default: "wiki" }
      - { label: "레이아웃(내부용, 건드리지 마세요)", name: "layout", widget: "hidden", default: "wiki.njk" }
      - { label: "본문", name: "body", widget: "markdown" }
